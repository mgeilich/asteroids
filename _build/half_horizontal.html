<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Tx1B">
      <div class="view view--half_horizontal">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--0">
  
    <div class="grid grid--cols-12 gap--small p--0.5 grow w--full">
       
      <!-- Left Column: Linear Timeline (5 cols landscape, 6 cols portrait) -->
      <div class="col--span-5 portrait:col--span-6 flex flex--col flex--center-x">
        <svg width="240" height="140" viewBox="0 0 240 140" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto max-w--full">
          <defs>
            <clipPath id="chart-clip-half-h">
              <rect x="42" y="14" width="192" height="110" />
            </clipPath>
          </defs>

          <!-- Axes -->
          <g stroke="#000" stroke-width="1.5">
            <line x1="44" y1="16" x2="44" y2="120" />
            <line x1="44" y1="120" x2="232" y2="120" stroke-width="2" />
          </g>

          <!-- Gridlines -->
          
            <g stroke="#000" stroke-width="1" stroke-dasharray="2 4">
              
                
                  <line x1="44" y1="89.6" x2="232" y2="89.6" />
                
              
                
                  <line x1="44" y1="63.5" x2="232" y2="63.5" />
                
              
                
                  <line x1="44" y1="33.1" x2="232" y2="33.1" />
                
              
                
                  <line x1="44" y1="20" x2="232" y2="20" />
                
              
            </g>
            <g fill="#000">
              
                
                  <text x="40" y="89.6" dy="3" text-anchor="end">5 LD</text>
                
              
                
                  <text x="40" y="63.5" dy="3" text-anchor="end">20 LD</text>
                
              
                
                  <text x="40" y="33.1" dy="3" text-anchor="end">100 LD</text>
                
              
                
                  <text x="40" y="20" dy="3" text-anchor="end">200 LD</text>
                
              
              <text x="40" y="120" dy="3" text-anchor="end">Earth</text>
            </g>
          

          <!-- Header Labels -->
          <g fill="#000" font-weight="bold">
            <text x="44" y="12" text-anchor="start">NOW (T-0)</text>
            <text x="232" y="12" text-anchor="end">T+7D</text>
          </g>

          <!-- Time Ticks along Bottom X-axis -->
          
            <g stroke="#000" stroke-width="1.5">
              
                
                  <line x1="44" y1="120" x2="44" y2="124" />
                
              
                
                  <line x1="70.9" y1="120" x2="70.9" y2="124" />
                
              
                
                  <line x1="97.7" y1="120" x2="97.7" y2="124" />
                
              
                
                  <line x1="124.6" y1="120" x2="124.6" y2="124" />
                
              
                
                  <line x1="151.4" y1="120" x2="151.4" y2="124" />
                
              
                
                  <line x1="178.3" y1="120" x2="178.3" y2="124" />
                
              
                
                  <line x1="205.1" y1="120" x2="205.1" y2="124" />
                
              
                
                  <line x1="232" y1="120" x2="232" y2="124" />
                
              
            </g>
            <g fill="#000">
              
                
              
                
                  <text x="70.9" y="134" text-anchor="middle">+1d</text>
                
              
                
                  <text x="97.7" y="134" text-anchor="middle">+2d</text>
                
              
                
                  <text x="124.6" y="134" text-anchor="middle">+3d</text>
                
              
                
                  <text x="151.4" y="134" text-anchor="middle">+4d</text>
                
              
                
                  <text x="178.3" y="134" text-anchor="middle">+5d</text>
                
              
                
                  <text x="205.1" y="134" text-anchor="middle">+6d</text>
                
              
                
                  <text x="232" y="134" text-anchor="middle">+7d</text>
                
              
            </g>
          

          <!-- Asteroid Markers and Labels -->
          
            <g stroke="#000" stroke-width="1.5" clip-path="url(#chart-clip-half-h)">
              
                
                  <circle cx="71.2" cy="27.9" r="7" fill="#000" />
                
              
                
                  <circle cx="116.6" cy="27.1" r="5" fill="#000" />
                
              
                
                  <circle cx="174.1" cy="22" r="7" fill="#000" />
                
              
                
                  <circle cx="224.1" cy="49.6" r="4" fill="none" />
                
              
                
                  <circle cx="67.9" cy="49.1" r="4" fill="none" />
                
              
                
                  <circle cx="191.4" cy="49" r="4" fill="none" />
                
              
                
                  <circle cx="152.5" cy="46.4" r="7" fill="none" />
                
              
                
                  <circle cx="208" cy="29" r="5" fill="none" />
                
              
            </g>
            <g fill="#000" clip-path="url(#chart-clip-half-h)">
              
                
                  <text x="81.2" y="30.9" text-anchor="start" data-clamp="1">1998 ..</text>
                
              
                
                  <text x="124.6" y="30.1" text-anchor="start" data-clamp="1">HC2</text>
                
              
                
                  <text x="184.1" y="25" text-anchor="start" data-clamp="1">BT2</text>
                
              
                
                  <text x="217.1" y="52.6" text-anchor="end" data-clamp="1">TG135</text>
                
              
                
                  <text x="74.9" y="52.1" text-anchor="start" data-clamp="1">DM215</text>
                
              
                
                  <text x="198.4" y="52" text-anchor="start" data-clamp="1">OY3</text>
                
              
                
                  <text x="162.5" y="49.4" text-anchor="start" data-clamp="1">2007 ..</text>
                
              
                
                  <text x="200" y="32" text-anchor="end" data-clamp="1">TP</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Status Banner & Summary (7 cols landscape, 6 cols portrait) -->
      <div class="col--span-7 portrait:col--span-6 flex flex--col gap--xsmall">
        <!-- Status Row -->
        <div class="flex flex--row flex--center-y gap--xsmall">
          <div>
            <div class="title title--small">ASTEROIDS</div>
            <div class="label label--small">Planetary Defense</div>
          </div>
          
          <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
            
              <span class="label label--outline px--1 py--0.5">NOMINAL</span>
            
          </div>
        </div>
        
        <!-- Metrics Row (Reflows to 1 column in portrait) -->
        <div class="grid grid--cols-2 portrait:grid--cols-1 gap--xsmall">
          <div class="bg--gray-75 rounded p--0.5 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label">UPCOMING:</span>
            <span class="value value--small">30</span>
          </div>
          <div class="bg--gray-75 rounded p--0.5 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label">CLOSEST:</span>
            <span class="value value--small">41.6 LD</span>
          </div>
        </div>
        
        <!-- Closest List Schedule -->
        <div class="flex flex--col gap--xsmall">
          <div class="label">CLOSEST SCHEDULED FLYBYS</div>
          
            
              
                <div class="flex flex--row flex--center-y gap--space-between p--0.5 rounded bg--gray-75">
                  <div class="grow">
                    <div class="title title--small" data-clamp="1">TG135</div>
                    <div class="label label--small" data-clamp="1">T+6d 16h &bull; Size: 39m</div>
                  </div>
                  <div class="text--right flex flex--col ml--auto">
                    <div class="value value--small" data-clamp="1">41.6 LD</div>
                    
                  </div>
                </div>
              
            
              
                <div class="flex flex--row flex--center-y gap--space-between p--0.5 rounded bg--gray-75">
                  <div class="grow">
                    <div class="title title--small" data-clamp="1">DM215</div>
                    <div class="label label--small" data-clamp="1">T+21h &bull; Size: 62m</div>
                  </div>
                  <div class="text--right flex flex--col ml--auto">
                    <div class="value value--small" data-clamp="1">42.9 LD</div>
                    
                  </div>
                </div>
              
            
          
        </div>
      </div>
    </div>
  
</div>
<div class="title_bar">
    <svg class="image image-stroke image-stroke--medium" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <path d="M12,2A10,10,0,1,0,22,12,10,10,0,0,0,12,2Zm1,17a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,13,19Zm5-5.5a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,18,13.5ZM12,12a2,2,0,1,1,2-2A2,2,0,0,1,12,12ZM7.5,9A1.5,1.5,0,1,1,9,7.5,1.5,1.5,0,0,1,7.5,9Zm1,7a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,8.5,16Z" fill="#000"/>
    </svg>
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
