<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Tx1B">
      <div class="view view--half_horizontal">
        









































<!-- class="layout" -->
<div class="layout layout--col p--0">
  
    <div class="flex flex--row gap--small p--0.5 grow w--full">
      
      <!-- Left Column: Linear Timeline (280x150) -->
      <div class="w--[280px] flex flex--col flex--center-x">
        <svg width="280" height="150" viewBox="0 0 280 150" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
          <defs>
            <clipPath id="chart-clip-half-h">
              <rect x="46" y="16" width="226" height="114" />
            </clipPath>
          </defs>

          <!-- Axes -->
          <g stroke="currentColor" stroke-width="1.5">
            <line x1="48" y1="18" x2="48" y2="128" />
            <line x1="48" y1="128" x2="270" y2="128" stroke-width="2" />
          </g>

          <!-- Gridlines -->
          
            <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 4">
              
                
                  <line x1="48" y1="95.8" x2="270" y2="95.8" />
                
              
                
                  <line x1="48" y1="68.1" x2="270" y2="68.1" />
                
              
                
                  <line x1="48" y1="35.9" x2="270" y2="35.9" />
                
              
                
                  <line x1="48" y1="22" x2="270" y2="22" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
                  <text x="44" y="95.8" dy="3" text-anchor="end">5 LD</text>
                
              
                
                  <text x="44" y="68.1" dy="3" text-anchor="end">20 LD</text>
                
              
                
                  <text x="44" y="35.9" dy="3" text-anchor="end">100 LD</text>
                
              
                
                  <text x="44" y="22" dy="3" text-anchor="end">200 LD</text>
                
              
              <text x="44" y="128" dy="3" text-anchor="end">Earth</text>
            </g>
          

          <!-- Header Labels -->
          <g fill="currentColor" class="label label--small">
            <text x="48" y="14" text-anchor="start">NOW (T-0)</text>
            <text x="270" y="14" text-anchor="end">T+7D</text>
          </g>

          <!-- Time Ticks along Bottom X-axis -->
          
            <g stroke="currentColor" stroke-width="1.5">
              
                
                  <line x1="48" y1="128" x2="48" y2="132" />
                
              
                
                  <line x1="79.7" y1="128" x2="79.7" y2="132" />
                
              
                
                  <line x1="111.4" y1="128" x2="111.4" y2="132" />
                
              
                
                  <line x1="143.1" y1="128" x2="143.1" y2="132" />
                
              
                
                  <line x1="174.9" y1="128" x2="174.9" y2="132" />
                
              
                
                  <line x1="206.6" y1="128" x2="206.6" y2="132" />
                
              
                
                  <line x1="238.3" y1="128" x2="238.3" y2="132" />
                
              
                
                  <line x1="270" y1="128" x2="270" y2="132" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
              
                
                  <text x="79.7" y="142" text-anchor="middle">+1d</text>
                
              
                
                  <text x="111.4" y="142" text-anchor="middle">+2d</text>
                
              
                
                  <text x="143.1" y="142" text-anchor="middle">+3d</text>
                
              
                
                  <text x="174.9" y="142" text-anchor="middle">+4d</text>
                
              
                
                  <text x="206.6" y="142" text-anchor="middle">+5d</text>
                
              
                
                  <text x="238.3" y="142" text-anchor="middle">+6d</text>
                
              
                
                  <text x="270" y="142" text-anchor="middle">+7d</text>
                
              
            </g>
          

          <!-- Asteroid Markers -->
          
            <g stroke="currentColor" stroke-width="1.5" clip-path="url(#chart-clip-half-h)">
              
                
                  <circle cx="51.7" cy="79.8" r="7" fill="currentColor" />
                
              
                
                  <circle cx="114.7" cy="35.5" r="5" fill="currentColor" />
                
              
                
                  <circle cx="229.8" cy="30.4" r="7" fill="currentColor" />
                
              
                
                  <circle cx="173.6" cy="23.6" r="7" fill="currentColor" />
                
              
                
                  <circle cx="143.4" cy="84.8" r="3" fill="none" />
                
              
                
                  <circle cx="107.1" cy="80.2" r="3" fill="none" />
                
              
                
                  <circle cx="158" cy="68.6" r="3" fill="none" />
                
              
                
                  <circle cx="117.7" cy="53.5" r="3" fill="none" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
                  <text x="61.7" y="82.8" text-anchor="start">BP31</text>
                
              
                
                  <text x="122.7" y="38.5" text-anchor="start">JR28</text>
                
              
                
                  <text x="239.8" y="33.4" text-anchor="start">1998 QC1</text>
                
              
                
                  <text x="183.6" y="26.6" text-anchor="start">CT4</text>
                
              
                
                  <text x="149.4" y="87.8" text-anchor="start">RH16</text>
                
              
                
                  <text x="113.1" y="83.2" text-anchor="start">EK</text>
                
              
                
                  <text x="164" y="71.6" text-anchor="start">RD2</text>
                
              
                
                  <text x="123.7" y="56.5" text-anchor="start">HU4</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Status Banner & Summary -->
      <div class="flex flex--col gap--xsmall grow">
        <!-- Status Row -->
        <div class="flex flex--row flex--center-y gap--xsmall">
          <div>
            <div class="title title--small">ASTEROIDS</div>
            <div class="label label--small">Planetary Defense</div>
          </div>
          
          <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
            
              <span class="label label--warning px--1 py--0.5"><strong>ALERT</strong></span>
            
          </div>
        </div>
        
        <!-- Metrics Row -->
        <div class="grid grid--cols-2 gap--xsmall">
          <div class="bg--gray-75 rounded p--0.5 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label">UPCOMING:</span>
            <span class="value value--small">41</span>
          </div>
          <div class="bg--gray-75 rounded p--0.5 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label">CLOSEST:</span>
            <span class="value value--small">8.7 LD</span>
          </div>
        </div>
        
        <!-- Closest List Schedule -->
        <div class="flex flex--col gap--xsmall">
          <div class="label"><strong>CLOSEST SCHEDULED FLYBYS</strong></div>
          
            
              <div class="flex flex--row flex--center-y gap--xsmall p--0.5 rounded bg--gray-75">
                <div class="grow">
                  <div class="title title--small" data-clamp="1">RH16</div>
                  <div class="label label--small" data-clamp="1">T+3d 0h &bull; Size: 25m</div>
                </div>
                <div class="text--right flex flex--col layout--right">
                  <div class="value value--small" data-clamp="1">8.7 LD</div>
                  
                </div>
              </div>
            
              <div class="flex flex--row flex--center-y gap--xsmall p--0.5 rounded bg--gray-75">
                <div class="grow">
                  <div class="title title--small" data-clamp="1">EK</div>
                  <div class="label label--small" data-clamp="1">T+1d 20h &bull; Size: 5m</div>
                </div>
                <div class="text--right flex flex--col layout--right">
                  <div class="value value--small" data-clamp="1">10.9 LD</div>
                  
                </div>
              </div>
            
          
        </div>
      </div>
    </div>
  
</div>
<div class="title_bar">
    <svg class="image" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <path d="M12,2A10,10,0,1,0,22,12,10,10,0,0,0,12,2Zm1,17a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,13,19Zm5-5.5a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,18,13.5ZM12,12a2,2,0,1,1,2-2A2,2,0,0,1,12,12ZM7.5,9A1.5,1.5,0,1,1,9,7.5,1.5,1.5,0,0,1,7.5,9Zm1,7a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,8.5,16Z" fill="currentColor"/>
    </svg>
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
