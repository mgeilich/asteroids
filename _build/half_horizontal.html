<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Tx1B">
      <div class="view view--half_horizontal">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--0">
  
    <div class="grid grid--cols-12 gap--small lg:gap--medium p--0.5 lg:p--1 grow w--full">
       
      <!-- Left Column: Linear Timeline (5 cols landscape, 6 cols portrait) -->
      <div class="col--span-5 portrait:col--span-6 flex flex--col flex--center-x">
        <svg width="280" height="140" viewBox="0 0 280 140" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto max-w--full">
          <defs>
            <clipPath id="chart-clip-half-h">
              <rect x="64" y="14" width="196" height="108" />
            </clipPath>
          </defs>

          <!-- Axes -->
          <g stroke="#000" stroke-width="1.5">
            <line x1="68" y1="16" x2="68" y2="120" />
            <line x1="68" y1="120" x2="256" y2="120" stroke-width="2" />
          </g>

          <!-- Gridlines -->
          
            <g stroke="#000" stroke-width="1" stroke-dasharray="2 2">
              
                
                  <line x1="68" y1="89.6" x2="256" y2="89.6" />
                
              
                
                  <line x1="68" y1="63.5" x2="256" y2="63.5" />
                
              
                
                  <line x1="68" y1="33.1" x2="256" y2="33.1" />
                
              
                
                  <line x1="68" y1="20" x2="256" y2="20" />
                
              
            </g>
            <g fill="#000">
              
                
                  <text x="64" y="89.6" dy="3" text-anchor="end">5 LD</text>
                
              
                
                  <text x="64" y="63.5" dy="3" text-anchor="end">20 LD</text>
                
              
                
                  <text x="64" y="33.1" dy="3" text-anchor="end">100 LD</text>
                
              
                
                  <text x="64" y="20" dy="3" text-anchor="end">200 LD</text>
                
              
              <text x="62" y="120" dy="3" text-anchor="end">Earth</text>
            </g>
          

          <!-- Header Labels -->
          <g fill="#000" font-weight="bold">
            <text x="68" y="12" text-anchor="start">NOW (T-0)</text>
            <text x="256" y="12" text-anchor="end">T+7D</text>
          </g>

          <!-- Time Ticks along Bottom X-axis -->
          
            <g stroke="#000" stroke-width="1.5">
              
                
                  <line x1="68" y1="120" x2="68" y2="124" />
                
              
                
                  <line x1="94.9" y1="120" x2="94.9" y2="124" />
                
              
                
                  <line x1="121.7" y1="120" x2="121.7" y2="124" />
                
              
                
                  <line x1="148.6" y1="120" x2="148.6" y2="124" />
                
              
                
                  <line x1="175.4" y1="120" x2="175.4" y2="124" />
                
              
                
                  <line x1="202.3" y1="120" x2="202.3" y2="124" />
                
              
                
                  <line x1="229.1" y1="120" x2="229.1" y2="124" />
                
              
                
                  <line x1="256" y1="120" x2="256" y2="124" />
                
              
            </g>
            <g fill="#000">
              
                
              
                
                  <text x="94.9" y="134" text-anchor="middle">+1d</text>
                
              
                
                  <text x="121.7" y="134" text-anchor="middle">+2d</text>
                
              
                
                  <text x="148.6" y="134" text-anchor="middle">+3d</text>
                
              
                
                  <text x="175.4" y="134" text-anchor="middle">+4d</text>
                
              
                
                  <text x="202.3" y="134" text-anchor="middle">+5d</text>
                
              
                
                  <text x="229.1" y="134" text-anchor="middle">+6d</text>
                
              
                
                  <text x="256" y="134" text-anchor="middle">+7d</text>
                
              
            </g>
          

          <!-- Asteroid Markers and Labels -->
          
            <g stroke="#000" stroke-width="1.5" clip-path="url(#chart-clip-half-h)">
              
                
                  <circle cx="188.8" cy="40.3" r="7" fill="#000" />
                
              
                
                  <circle cx="245.1" cy="20.8" r="5" fill="#000" />
                
              
                
                  <circle cx="175.1" cy="58.4" r="3" fill="none" />
                
              
                
                  <circle cx="217.8" cy="57.9" r="4" fill="none" />
                
              
                
                  <circle cx="131.3" cy="45.9" r="4" fill="none" />
                
              
                
                  <circle cx="219" cy="39" r="3" fill="none" />
                
              
                
                  <circle cx="92.8" cy="37.5" r="7" fill="none" />
                
              
                
                  <circle cx="153.1" cy="33.7" r="4" fill="none" />
                
              
            </g>
            <g fill="#000" clip-path="url(#chart-clip-half-h)">
              
                
                  <text x="198.8" y="43.3" text-anchor="start" data-clamp="1">PL23</text>
                
              
                
                  <text x="237.1" y="23.8" text-anchor="end" data-clamp="1">SY16</text>
                
              
                
                  <text x="181.1" y="61.4" text-anchor="start" data-clamp="1">JA</text>
                
              
                
                  <text x="224.8" y="60.9" text-anchor="start" data-clamp="1">VB37</text>
                
              
                
                  <text x="138.3" y="48.9" text-anchor="start" data-clamp="1">MC5</text>
                
              
                
                  <text x="225" y="42" text-anchor="start" data-clamp="1">SE</text>
                
              
                
                  <text x="102.8" y="40.5" text-anchor="start" data-clamp="1">TR12</text>
                
              
                
                  <text x="160.1" y="36.7" text-anchor="start" data-clamp="1">RL15</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Status Banner & Summary (7 cols landscape, 6 cols portrait) -->
      <div class="col--span-7 portrait:col--span-6 flex flex--col gap--xsmall lg:gap--small">
        <!-- Status Row -->
        <div class="flex flex--row flex--center-y gap--xsmall lg:gap--small">
          <div>
            <div class="title title--small lg:title--base">ASTEROIDS</div>
            <div class="label label--small lg:label--base">Planetary Defense</div>
          </div>
          
          <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
            
              <span class="label label--outline px--1 py--0.5 lg:label--base">NOMINAL</span>
            
          </div>
        </div>
        
        <!-- Metrics Row (Reflows to 1 column in portrait) -->
        <div class="grid grid--cols-2 portrait:grid--cols-1 gap--xsmall lg:gap--small">
          <div class="bg--gray-75 rounded p--0.5 lg:p--1 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label lg:label--large 1bit:text-stroke 2bit:text-stroke">UPCOMING:</span>
            <span class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke">38</span>
          </div>
          <div class="bg--gray-75 rounded p--0.5 lg:p--1 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label lg:label--large 1bit:text-stroke 2bit:text-stroke">CLOSEST:</span>
            <span class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke">26.2 LD</span>
          </div>
        </div>
        
        <!-- Closest List Schedule -->
        <div class="flex flex--col gap--xsmall lg:gap--small">
          <div class="label lg:label--large">CLOSEST SCHEDULED FLYBYS</div>
          
            
              
                <div class="flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
                  <div class="grow">
                    <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">JA</div>
                    <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+3d 23h &bull; Size: 17m</div>
                  </div>
                  <div class="text--right flex flex--col ml--auto">
                    <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">26.2 LD</div>
                    
                  </div>
                </div>
              
            
              
                <div class="hidden lg:flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
                  <div class="grow">
                    <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">VB37</div>
                    <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+5d 13h &bull; Size: 34m</div>
                  </div>
                  <div class="text--right flex flex--col ml--auto">
                    <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">26.8 LD</div>
                    
                  </div>
                </div>
              
            
              
                <div class="hidden lg:flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
                  <div class="grow">
                    <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">MC5</div>
                    <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+2d 8h &bull; Size: 36m</div>
                  </div>
                  <div class="text--right flex flex--col ml--auto">
                    <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">50.8 LD</div>
                    
                  </div>
                </div>
              
            
          
        </div>
      </div>
    </div>
  
</div>
<div class="title_bar">
    <svg class="image image-stroke image-stroke--medium" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
