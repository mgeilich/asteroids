<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Tx1B">
      <div class="view view--half_horizontal">
        





































<!-- class="layout" -->
<div class="layout layout--col">
  
    <div class="flex flex--col md:flex--row portrait:flex--col gap--xsmall p--0.5 grow w--full">
      
      <!-- Left Column: Compact Linear Timeline (260x150) -->
      <div class="w--full md:w--[260px] lg:w--[340px] flex flex--col flex--center-x">
        <svg width="260" height="150" viewBox="0 0 260 150" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
          <defs>
            <clipPath id="chart-clip-half-h">
              <rect x="33" y="14" width="214" height="116" />
            </clipPath>
          </defs>

          <!-- Axes -->
          <g stroke="currentColor" stroke-width="1.5">
            <line x1="35" y1="16" x2="35" y2="128" />
            <line x1="35" y1="128" x2="245" y2="128" stroke-width="2" />
          </g>

          <!-- Gridlines -->
          
            <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 4">
              
                
                  <line x1="35" y1="100.5" x2="245" y2="100.5" />
                
              
                
                  <line x1="35" y1="73" x2="245" y2="73" />
                
              
                
                  <line x1="35" y1="45.5" x2="245" y2="45.5" />
                
              
                
                  <line x1="35" y1="18" x2="245" y2="18" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
                  <text x="31" y="100.5" dy="3" text-anchor="end">10 LD</text>
                
              
                
                  <text x="31" y="73" dy="3" text-anchor="end">20 LD</text>
                
              
                
                  <text x="31" y="45.5" dy="3" text-anchor="end">30 LD</text>
                
              
                
                  <text x="31" y="18" dy="3" text-anchor="end">40 LD</text>
                
              
            </g>
          

          <!-- Header Labels -->
          <g fill="currentColor" class="label label--small">
            <text x="35" y="11" text-anchor="start">NOW (T-0)</text>
            <text x="245" y="11" text-anchor="end">T+7D</text>
          </g>

          <!-- Time Ticks along Bottom X-axis -->
          
            <g stroke="currentColor" stroke-width="1.5">
              
                
                  <line x1="35" y1="128" x2="35" y2="132" />
                
              
                
                  <line x1="65" y1="128" x2="65" y2="132" />
                
              
                
                  <line x1="95" y1="128" x2="95" y2="132" />
                
              
                
                  <line x1="125" y1="128" x2="125" y2="132" />
                
              
                
                  <line x1="155" y1="128" x2="155" y2="132" />
                
              
                
                  <line x1="185" y1="128" x2="185" y2="132" />
                
              
                
                  <line x1="215" y1="128" x2="215" y2="132" />
                
              
                
                  <line x1="245" y1="128" x2="245" y2="132" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
              
                
                  <text x="65" y="142" text-anchor="middle">+1d</text>
                
              
                
                  <text x="95" y="142" text-anchor="middle">+2d</text>
                
              
                
                  <text x="125" y="142" text-anchor="middle">+3d</text>
                
              
                
                  <text x="155" y="142" text-anchor="middle">+4d</text>
                
              
                
                  <text x="185" y="142" text-anchor="middle">+5d</text>
                
              
                
                  <text x="215" y="142" text-anchor="middle">+6d</text>
                
              
                
                  <text x="245" y="142" text-anchor="middle">+7d</text>
                
              
            </g>
          

          <!-- Asteroid Markers -->
          
            <g stroke="currentColor" stroke-width="1.5" clip-path="url(#chart-clip-half-h)">
              
                
                  <circle cx="133.6" cy="104.1" r="3" fill="none" />
                
              
                
                  <circle cx="36.9" cy="102.4" r="7" fill="currentColor" />
                
              
                
                  <circle cx="99.2" cy="98" r="3" fill="none" />
                
              
                
                  <circle cx="46.8" cy="97.4" r="7" fill="currentColor" />
                
              
                
                  <circle cx="147.4" cy="74.6" r="3" fill="none" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
                  <text x="139.6" y="107.1" text-anchor="start">RH16</text>
                
              
                
                  <text x="46.9" y="105.4" text-anchor="start">2006 B..</text>
                
              
                
                  <text x="105.2" y="101" text-anchor="start">EK</text>
                
              
                
                  <text x="56.8" y="100.4" text-anchor="start">BP31</text>
                
              
                
                  <text x="153.4" y="77.6" text-anchor="start">RD2</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Status Banner & Summary -->
      <div class="grid grid--cols-1 gap--xsmall grow">
        <!-- Status Row -->
        <div class="flex flex--row flex--center-y gap--xsmall mb--0.5">
          <div>
            <div class="title title--small">ASTEROIDS</div>
            <div class="label label--small">Planetary Defense Telemetry</div>
          </div>
          
          <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
            
              <span class="label label--warning p--1"><strong>ALERT</strong></span>
            
          </div>
        </div>
        
        <!-- Metrics Row -->
        <div class="grid grid--cols-2 gap--xsmall mb--0.5">
          <div class="bg--gray-75 rounded p--0.5 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label">UPCOMING:</span>
            <span class="value value--small">40</span>
          </div>
          <div class="bg--gray-75 rounded p--0.5 flex flex--row gap--xsmall flex--center-x flex--center-y">
            <span class="label">CLOSEST:</span>
            <span class="value value--small">8.7 LD</span>
          </div>
        </div>
        
        <!-- Closest List Schedule -->
        <div class="grid grid--cols-1 gap--xsmall">
          
            <div class="label"><strong>CLOSEST SCHEDULED FLYBYS</strong></div>
            
              <div class="flex flex--row flex--center-y gap--xsmall p--0.5 rounded bg--gray-75 grow">
                <div class="grow">
                  <div class="title title--small" data-clamp="1">RH16</div>
                  <div class="label label--small" data-clamp="1">T+3d 6h &bull; Size: 25m</div>
                </div>
                <div class="text--right flex flex--col layout--right">
                  <div class="value value--small" data-clamp="1">8.7 LD</div>
                  
                </div>
              </div>
            
              <div class="flex flex--row flex--center-y gap--xsmall p--0.5 rounded bg--gray-75 grow">
                <div class="grow">
                  <div class="title title--small" data-clamp="1">2006 B..</div>
                  <div class="label label--small" data-clamp="1">T+1h &bull; Size: 536m</div>
                </div>
                <div class="text--right flex flex--col layout--right">
                  <div class="value value--small" data-clamp="1">9.3 LD</div>
                  
                    <span class="label label--warning px--1"><strong>HAZARD</strong></span>
                  
                </div>
              </div>
            
          
        </div>
      </div>
    </div>
  
</div>
<div class="title_bar">
    
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
