<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--2x2">
      <div class="view view--quadrant">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--0 gap--xsmall lg:gap--small">
  
    <!-- Header -->
    <div class="flex flex--row flex--center-y gap--xsmall w--full">
      <div class="title title--small lg:title--base">ASTEROIDS</div>
      <div class="ml--auto">
        
          <span class="label label--outline px--1 py--0.5 lg:label--base">NOMINAL</span>
        
      </div>
    </div>
    
    <!-- Hero Metric Block -->
    <div class="flex flex--col flex--center-x py--0.5 lg:py--1">
      <div class="value value--base lg:value--xlarge" data-fit-value="true">39</div>
      <div class="label label--small lg:label--large">UPCOMING NEOS (7 DAYS)</div>
    </div>
    
    <!-- Secondary Glance Callouts -->
    <div class="grid grid--cols-2 gap--xsmall lg:gap--small w--full">
      <div class="bg--gray-75 rounded p--0.5 lg:p--1 flex flex--col flex--center-x">
        <span class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke">CLOSEST</span>
        <span class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke">26.2 LD</span>
      </div>
      <div class="bg--gray-75 rounded p--0.5 lg:p--1 flex flex--col flex--center-x">
        <span class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke">MAX SIZE</span>
        <span class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke">1450m</span>
      </div>
    </div>

    <!-- Micro-Status Callout -->
    <div class="rounded bg--gray-75 p--0.5 lg:p--1 flex flex--row flex--center-x w--full">
      <span class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke">ALL FLYBYS SAFE (NOMINAL)</span>
    </div>
    
    <!-- Additional Info on Large Screen (TRMNL X) -->
    
      <div class="hidden lg:flex flex--col gap--xsmall w--full">
        <div class="label lg:label--base">NEXT FLYBY:</div>
        
          <div class="flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
            <div class="grow">
              <div class="title lg:title--small 1bit:text-stroke 2bit:text-stroke" data-clamp="1">JA</div>
              <div class="label lg:label--small 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+5d 23h</div>
            </div>
            <div class="text--right ml--auto">
              <div class="value lg:value--small 1bit:text-stroke 2bit:text-stroke">26.2 LD</div>
            </div>
          </div>
        
      </div>
    
  
</div>
<div class="title_bar">
    <svg class="image image-stroke image-stroke--medium" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <path d="M12,2A10,10,0,1,0,22,12,10,10,0,0,0,12,2Zm1,17a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,13,19Zm5-5.5a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,18,13.5ZM12,12a2,2,0,1,1,2-2A2,2,0,0,1,12,12ZM7.5,9A1.5,1.5,0,1,1,9,7.5,1.5,1.5,0,0,1,7.5,9Zm1,7a1.5,1.5,0,1,1,1.5-1.5A1.5,1.5,0,0,1,8.5,16Z" fill="#000"/>
    </svg>
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
