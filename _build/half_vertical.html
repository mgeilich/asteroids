<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Lx1R">
      <div class="view view--half_vertical">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--0 gap--xsmall lg:gap--small">
  
    <!-- Top Half: Linear Timeline Chart (360x160) -->
    <div class="w--full flex flex--col flex--center-x">
      <svg width="360" height="160" viewBox="0 0 360 160" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
        <defs>
          <clipPath id="chart-clip-half-v">
            <rect x="46" y="16" width="306" height="122" />
          </clipPath>
        </defs>

        <!-- Axes -->
        <g stroke="#000" stroke-width="1.5">
          <line x1="48" y1="16" x2="48" y2="135" />
          <line x1="48" y1="135" x2="350" y2="135" stroke-width="2" />
        </g>

        <!-- Horizontal Gridlines -->
        
          <g stroke="#000" stroke-width="1" stroke-dasharray="2 2">
            
              
                <line x1="48" y1="100.1" x2="350" y2="100.1" />
              
            
              
                <line x1="48" y1="70" x2="350" y2="70" />
              
            
              
                <line x1="48" y1="50.1" x2="350" y2="50.1" />
              
            
              
                <line x1="48" y1="35" x2="350" y2="35" />
              
            
              
                <line x1="48" y1="20" x2="350" y2="20" />
              
            
          </g>
          <g fill="#000">
            
              
                <text x="44" y="100.1" dy="3" text-anchor="end">5 LD</text>
              
            
              
                <text x="44" y="70" dy="3" text-anchor="end">20 LD</text>
              
            
              
                <text x="44" y="50.1" dy="3" text-anchor="end">50 LD</text>
              
            
              
                <text x="44" y="35" dy="3" text-anchor="end">100 LD</text>
              
            
              
                <text x="44" y="20" dy="3" text-anchor="end">200 LD</text>
              
            
            <text x="44" y="135" dy="3" text-anchor="end">Earth</text>
          </g>
        

        <!-- Header Labels -->
        <g fill="#000" font-weight="bold">
          <text x="48" y="12" text-anchor="start">NOW (T-0)</text>
          <text x="350" y="12" text-anchor="end">T+7 DAYS</text>
        </g>

        <!-- Time Ticks along Bottom X-axis -->
        
          <g stroke="#000" stroke-width="1.5">
            
              
                <line x1="48" y1="135" x2="48" y2="139" />
              
            
              
                <line x1="91.1" y1="135" x2="91.1" y2="139" />
              
            
              
                <line x1="134.3" y1="135" x2="134.3" y2="139" />
              
            
              
                <line x1="177.4" y1="135" x2="177.4" y2="139" />
              
            
              
                <line x1="220.6" y1="135" x2="220.6" y2="139" />
              
            
              
                <line x1="263.7" y1="135" x2="263.7" y2="139" />
              
            
              
                <line x1="306.9" y1="135" x2="306.9" y2="139" />
              
            
              
                <line x1="350" y1="135" x2="350" y2="139" />
              
            
          </g>
          <g fill="#000">
            
              
            
              
                <text x="91.1" y="149" text-anchor="middle">+1d</text>
              
            
              
                <text x="134.3" y="149" text-anchor="middle">+2d</text>
              
            
              
                <text x="177.4" y="149" text-anchor="middle">+3d</text>
              
            
              
                <text x="220.6" y="149" text-anchor="middle">+4d</text>
              
            
              
                <text x="263.7" y="149" text-anchor="middle">+5d</text>
              
            
              
                <text x="306.9" y="149" text-anchor="middle">+6d</text>
              
            
              
                <text x="350" y="149" text-anchor="middle">+7d</text>
              
            
          </g>
        

        <!-- Asteroid Markers -->
        
          <g stroke="#000" stroke-width="1.5" clip-path="url(#chart-clip-half-v)">
            
              
                <circle cx="102.5" cy="69.8" r="7" fill="#000" />
              
            
              
                <circle cx="136.9" cy="49.4" r="9" fill="#000" />
              
            
              
                <circle cx="238.7" cy="49.1" r="9" fill="#000" />
              
            
              
                <circle cx="198.7" cy="86.5" r="5" fill="none" />
              
            
              
                <circle cx="231.6" cy="68.9" r="3" fill="none" />
              
            
              
                <circle cx="50.4" cy="59.8" r="7" fill="none" />
              
            
              
                <circle cx="331.7" cy="59.1" r="3" fill="none" />
              
            
              
                <circle cx="277.1" cy="49.4" r="5" fill="none" />
              
            
              
                <circle cx="88.2" cy="43.2" r="5" fill="none" />
              
            
              
                <circle cx="348.7" cy="34.9" r="5" fill="none" />
              
            
          </g>
          <g fill="#000" clip-path="url(#chart-clip-half-v)">
            
              
                <text x="112.5" y="72.8" text-anchor="start" data-clamp="1">FR</text>
              
            
              
                <text x="148.9" y="52.4" text-anchor="start" data-clamp="1">FA</text>
              
            
              
                <text x="250.7" y="52.1" text-anchor="start" data-clamp="1">EU29</text>
              
            
              
                <text x="206.7" y="89.5" text-anchor="start" data-clamp="1">FX9</text>
              
            
              
                <text x="237.6" y="71.9" text-anchor="start" data-clamp="1">VG</text>
              
            
              
                <text x="60.4" y="62.8" text-anchor="start" data-clamp="1">FV32</text>
              
            
              
                <text x="325.7" y="62.1" text-anchor="end" data-clamp="1">GM1</text>
              
            
              
                <text x="285.1" y="52.4" text-anchor="start" data-clamp="1">SQ8</text>
              
            
              
                <text x="96.2" y="46.2" text-anchor="start" data-clamp="1">SV6</text>
              
            
              
                <text x="340.7" y="37.9" text-anchor="end" data-clamp="1">ST</text>
              
            
          </g>
        
      </svg>
    </div>
    
    <!-- Middle Telemetry Status Row -->
    <div class="flex flex--row flex--center-y gap--small px--1 py--0.5 lg:py--1 w--full">
      <div class="flex flex--col">
        <div class="title title--small lg:title--base">ASTEROIDS</div>
        <div class="label label--small lg:label--base">UPCOMING: 41 NEOs</div>
      </div>
      
      <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
        
          <span class="label label--outline px--1 py--0.5 lg:label--base">NOMINAL</span>
        
      </div>
      
      <div class="flex flex--col items--end text--right ml--auto">
        <span class="label label--small lg:label--base">CLOSEST</span>
        <span class="value value--small lg:value--base">9.3 LD</span>
      </div>
    </div>

    <!-- Bottom: Closest Scheduled Flybys -->
    <div class="flex flex--col gap--xsmall lg:gap--small w--full px--1">
      <div class="label lg:label--large">CLOSEST SCHEDULED FLYBYS</div>
      
      
        
          
            <div class="flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">FX9</div>
                <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+3d 11h &bull; Size: 66m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">9.3 LD</div>
                
              </div>
            </div>
          
        
          
            <div class="flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">2010 FR</div>
                <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+1d 6h &bull; Size: 197m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">20.2 LD</div>
                
                  <span class="label label--filled px--1 lg:label--base">HAZARD</span>
                
              </div>
            </div>
          
        
          
            <div class="hidden lg:flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">VG</div>
                <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+4d 6h &bull; Size: 14m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">21.0 LD</div>
                
              </div>
            </div>
          
        
      
    </div>
  
</div>
<div class="title_bar">
    <svg class="image image-stroke image-stroke--medium" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

    </svg>
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>

</html>
