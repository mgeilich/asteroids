<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Lx1R">
      <div class="view view--half_vertical">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--0 gap--xsmall">
  
    <!-- Top Half: Linear Timeline Chart (360x160) -->
    <div class="w--full flex flex--col flex--center-x">
      <svg width="360" height="160" viewBox="0 0 360 160" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
        <defs>
          <clipPath id="chart-clip-half-v">
            <rect x="46" y="16" width="306" height="122" />
          </clipPath>
        </defs>

        <!-- Axes -->
        <g stroke="#000" stroke-width="1.5">
          <line x1="48" y1="16" x2="48" y2="135" />
          <line x1="48" y1="135" x2="350" y2="135" stroke-width="2" />
        </g>

        <!-- Horizontal Gridlines -->
        
          <g stroke="#000" stroke-width="1" stroke-dasharray="2 2">
            
              
                <line x1="48" y1="100.1" x2="350" y2="100.1" />
              
            
              
                <line x1="48" y1="70" x2="350" y2="70" />

                <line x1="48" y1="20" x2="350" y2="20" />
              
            
          </g>
          <g fill="#000">
            
              
                <text x="44" y="100.1" dy="3" text-anchor="end">5 LD</text>
              
            
              
                <text x="44" y="70" dy="3" text-anchor="end">20 LD</text>
              
            
              
                <text x="44" y="50.1" dy="3" text-anchor="end">50 LD</text>
              
            
              
                <text x="44" y="35" dy="3" text-anchor="end">100 LD</text>
              
            
              
                <text x="44" y="20" dy="3" text-anchor="end">200 LD</text>
              
            
            <text x="44" y="135" dy="3" text-anchor="end">Earth</text>
          </g>
        

        <!-- Header Labels -->
        <g fill="#000" font-weight="bold">
          <text x="48" y="12" text-anchor="start">NOW (T-0)</text>
          <text x="350" y="12" text-anchor="end">T+7 DAYS</text>
        </g>

        <!-- Time Ticks along Bottom X-axis -->
        
          <g stroke="#000" stroke-width="1.5">
            
              
                <line x1="48" y1="135" x2="48" y2="139" />
              
            
              
                <line x1="91.1" y1="135" x2="91.1" y2="139" />
              
            
              
                <line x1="134.3" y1="135" x2="134.3" y2="139" />
              
            
              
                <line x1="177.4" y1="135" x2="177.4" y2="139" />
              
            
              
                <line x1="220.6" y1="135" x2="220.6" y2="139" />
              
            
              
                <line x1="263.7" y1="135" x2="263.7" y2="139" />
              
            
              
                <line x1="306.9" y1="135" x2="306.9" y2="139" />
              
            
              
                <line x1="350" y1="135" x2="350" y2="139" />
              
            
          </g>
          <g fill="#000">
            
              
            
              
                <text x="91.1" y="149" text-anchor="middle">+1d</text>
              
            
              
                <text x="134.3" y="149" text-anchor="middle">+2d</text>
              
            
              
                <text x="177.4" y="149" text-anchor="middle">+3d</text>
              
            
              
                <text x="220.6" y="149" text-anchor="middle">+4d</text>

                <text x="350" y="149" text-anchor="middle">+7d</text>
              
            
          </g>
        

        <!-- Asteroid Markers -->
        
          <g stroke="#000" stroke-width="1.5" clip-path="url(#chart-clip-half-v)">
            
              
                <circle cx="91.6" cy="29.1" r="9" fill="#000" />

                <circle cx="311.4" cy="30.3" r="7" fill="none" />
              
            
          </g>
          <g fill="#000" clip-path="url(#chart-clip-half-v)">
            
              
                <text x="103.6" y="32.1" text-anchor="start" data-clamp="1">1998 ..</text>
              
            
              
                <text x="174.6" y="31.1" text-anchor="start" data-clamp="1">HC2</text>
              
            
              
                <text x="269.1" y="25.3" text-anchor="start" data-clamp="1">BT2</text>
              
            
              
                <text x="329.3" y="57.1" text-anchor="end" data-clamp="1">TG135</text>
              
            
              
                <text x="94.4" y="56.4" text-anchor="start" data-clamp="1">DM215</text>
              
            
              
                <text x="292.8" y="56.3" text-anchor="start" data-clamp="1">OY3</text>
              
            
              
                <text x="234.2" y="53.3" text-anchor="start" data-clamp="1">2007 ..</text>
              
            
              
                <text x="144.2" y="40.3" text-anchor="start" data-clamp="1">PM</text>
              
            
              
                <text x="282.9" y="39.6" text-anchor="start" data-clamp="1">LV</text>
              
            
              
                <text x="321.4" y="33.3" text-anchor="start" data-clamp="1">TP</text>
              
            
          </g>
        
      </svg>
    </div>
    
    <!-- Middle Telemetry Status Row -->
    <div class="flex flex--row flex--center-y gap--small px--1 py--0.5 w--full">
      <div class="flex flex--col">
        <div class="title title--small">ASTEROIDS</div>
        <div class="label label--small">UPCOMING: 30 NEOs</div>
      </div>
      
      <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
        
          <span class="label label--outline px--1 py--0.5">NOMINAL</span>
        
      </div>
      
      <div class="flex flex--col items--end text--right ml--auto">
        <span class="label label--small">CLOSEST</span>
        <span class="value value--small">41.6 LD</span>
      </div>
    </div>

    <!-- Bottom: Closest Scheduled Flybys (2 items for clean vertical space) -->
    <div class="flex flex--col gap--xsmall w--full px--1">
      <div class="label">CLOSEST SCHEDULED FLYBYS</div>
      
      
        
          
            <div class="flex flex--row flex--center-y gap--space-between p--0.5 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small" data-clamp="1">TG135</div>
                <div class="label label--small" data-clamp="1">T+6d 16h &bull; Size: 39m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small" data-clamp="1">41.6 LD</div>
                
              </div>
            </div>
          
        
          
            <div class="flex flex--row flex--center-y gap--space-between p--0.5 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small" data-clamp="1">DM215</div>
                <div class="label label--small" data-clamp="1">T+21h &bull; Size: 62m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small" data-clamp="1">42.9 LD</div>
                
              </div>
            </div>
          
        
      
    </div>
  
</div>
<div class="title_bar">
    <svg class="image image-stroke image-stroke--medium" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

    </svg>
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
