<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />

    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Lx1R">
      <div class="view view--half_vertical">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--0 gap--xsmall lg:gap--small">
  
    <!-- Top Half: Linear Timeline Chart (360x160) -->
    <div class="w--full flex flex--col flex--center-x">
      <svg width="360" height="160" viewBox="0 0 360 160" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
        <defs>
          <clipPath id="chart-clip-half-v">
            <rect x="68" y="14" width="266" height="123" />
          </clipPath>
        </defs>

        <!-- Axes -->
        <g stroke="#000" stroke-width="1.5">
          <line x1="72" y1="16" x2="72" y2="135" />
          <line x1="72" y1="135" x2="330" y2="135" stroke-width="2" />
        </g>

        <!-- Horizontal Gridlines -->
        
          <g stroke="#000" stroke-width="1" stroke-dasharray="2 2">
            
              
                <line x1="72" y1="100.1" x2="330" y2="100.1" />
              
            
              
                <line x1="72" y1="70" x2="330" y2="70" />
              
            
              
                <line x1="72" y1="50.1" x2="330" y2="50.1" />
              
            
              
                <line x1="72" y1="35" x2="330" y2="35" />
              
            
              
                <line x1="72" y1="20" x2="330" y2="20" />
              
            
          </g>
          <g fill="#000">
            
              
                <text x="68" y="100.1" dy="3" text-anchor="end">5 LD</text>
              
            
              
                <text x="68" y="70" dy="3" text-anchor="end">20 LD</text>
              
            
              
                <text x="68" y="50.1" dy="3" text-anchor="end">50 LD</text>
              
            
              
                <text x="68" y="35" dy="3" text-anchor="end">100 LD</text>
              
            
              
                <text x="68" y="20" dy="3" text-anchor="end">200 LD</text>
              
            
            <text x="66" y="135" dy="3" text-anchor="end">Earth</text>
          </g>
        

        <!-- Header Labels -->
        <g fill="#000" font-weight="bold">
          <text x="72" y="12" text-anchor="start">NOW (T-0)</text>
          <text x="330" y="12" text-anchor="end">T+7 DAYS</text>
        </g>

        <!-- Time Ticks along Bottom X-axis -->
        
          <g stroke="#000" stroke-width="1.5">
            
              
                <line x1="72" y1="135" x2="72" y2="139" />
              
            
              
                <line x1="108.9" y1="135" x2="108.9" y2="139" />
              
            
              
                <line x1="145.7" y1="135" x2="145.7" y2="139" />
              
            
              
                <line x1="182.6" y1="135" x2="182.6" y2="139" />
              
            
              
                <line x1="219.4" y1="135" x2="219.4" y2="139" />
              
            
              
                <line x1="256.3" y1="135" x2="256.3" y2="139" />
              
            
              
                <line x1="293.1" y1="135" x2="293.1" y2="139" />
              
            
              
                <line x1="330" y1="135" x2="330" y2="139" />
              
            
          </g>
          <g fill="#000">
            
              
            
              
                <text x="108.9" y="149" text-anchor="middle">+1d</text>
              
            
              
                <text x="145.7" y="149" text-anchor="middle">+2d</text>
              
            
              
                <text x="182.6" y="149" text-anchor="middle">+3d</text>
              
            
              
                <text x="219.4" y="149" text-anchor="middle">+4d</text>
              
            
              
                <text x="256.3" y="149" text-anchor="middle">+5d</text>

                <text x="330" y="149" text-anchor="middle">+7d</text>
              
            
          </g>
        

        <!-- Asteroid Markers -->
        
          <g stroke="#000" stroke-width="1.5" clip-path="url(#chart-clip-half-v)">
            
              
                <circle cx="311.7" cy="43.3" r="9" fill="#000" />
              
            
              
                <circle cx="293" cy="64.1" r="3" fill="none" />
              
            
              
                <circle cx="133.2" cy="59.1" r="3" fill="none" />

                <circle cx="293.1" cy="29.9" r="7" fill="none" />
              
            
          </g>
          <g fill="#000" clip-path="url(#chart-clip-half-v)">
            
              
                <text x="299.7" y="46.3" text-anchor="end" data-clamp="1">PL23</text>
              
            
              
                <text x="299" y="67.1" text-anchor="start" data-clamp="1">JA</text>
              
            
              
                <text x="139.2" y="62.1" text-anchor="start" data-clamp="1">GM1</text>
              
            
              
                <text x="240.9" y="52.8" text-anchor="start" data-clamp="1">MC5</text>
              
            
              
                <text x="94.6" y="52.4" text-anchor="start" data-clamp="1">SQ8</text>
              
            
              
                <text x="294" y="49.9" text-anchor="start" data-clamp="1">BK509</text>
              
            
              
                <text x="192" y="43.1" text-anchor="start" data-clamp="1">TR12</text>
              
            
              
                <text x="160.1" y="39.2" text-anchor="start" data-clamp="1">VH2</text>
              
            
              
                <text x="126.5" y="35.2" text-anchor="start" data-clamp="1">UN1</text>
              
            
              
                <text x="303.1" y="32.9" text-anchor="start" data-clamp="1">TZ5</text>
              
            
          </g>
        
      </svg>
    </div>
    
    <!-- Middle Telemetry Status Row -->
    <div class="flex flex--row flex--center-y gap--small px--1 py--0.5 lg:py--1 w--full">
      <div class="flex flex--col">
        <div class="title title--small lg:title--base">ASTEROIDS</div>
        <div class="label label--small lg:label--base">UPCOMING: 39 NEOs</div>
      </div>
      
      <div class="flex flex--row flex--center-y gap--xsmall ml--auto">
        
          <span class="label label--outline px--1 py--0.5 lg:label--base">NOMINAL</span>
        
      </div>
      
      <div class="flex flex--col items--end text--right ml--auto">
        <span class="label label--small lg:label--base">CLOSEST</span>
        <span class="value value--small lg:value--base">26.2 LD</span>
      </div>
    </div>

    <!-- Bottom: Closest Scheduled Flybys -->
    <div class="flex flex--col gap--xsmall lg:gap--small w--full px--1">
      <div class="label lg:label--large">CLOSEST SCHEDULED FLYBYS</div>
      
      
        
          
            <div class="flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">JA</div>
                <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+5d 23h &bull; Size: 17m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">26.2 LD</div>
                
              </div>
            </div>
          
        
          
            <div class="flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">GM1</div>
                <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+1d 15h &bull; Size: 15m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">32.9 LD</div>
                
              </div>
            </div>
          
        
          
            <div class="hidden lg:flex flex--row flex--center-y gap--space-between p--0.5 lg:p--1 rounded bg--gray-75">
              <div class="grow">
                <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">QE3</div>
                <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+1d 8h &bull; Size: 432m</div>
              </div>
              <div class="text--right flex flex--col ml--auto">
                <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">34.5 LD</div>
                
              </div>
            </div>
          
        
      
    </div>
  
</div>
<div class="title_bar">

  </div>
