<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Lx1R">
      <div class="view view--half_vertical">
        





































<!-- class="layout" -->
<div class="layout layout--col gap--small">
  
    <!-- Top Half: Linear Timeline Chart (360x180) -->
    <div class="w--full flex flex--col flex--center-x">
      <svg width="360" height="180" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
        <defs>
          <clipPath id="chart-clip-half-v">
            <rect x="38" y="16" width="310" height="142" />
          </clipPath>
        </defs>

        <!-- Axes -->
        <g stroke="currentColor" stroke-width="1.5">
          <line x1="40" y1="18" x2="40" y2="155" />
          <line x1="40" y1="155" x2="345" y2="155" stroke-width="2" />
        </g>

        <!-- Horizontal Gridlines -->
        
          <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 4">
            
              
                <line x1="40" y1="121.3" x2="345" y2="121.3" />
              
            
              
                <line x1="40" y1="87.5" x2="345" y2="87.5" />
              
            
              
                <line x1="40" y1="53.8" x2="345" y2="53.8" />
              
            
              
                <line x1="40" y1="20" x2="345" y2="20" />
              
            
          </g>
          <g fill="currentColor" class="label label--small">
            
              
                <text x="36" y="121.3" dy="3" text-anchor="end">10 LD</text>
              
            
              
                <text x="36" y="87.5" dy="3" text-anchor="end">20 LD</text>
              
            
              
                <text x="36" y="53.8" dy="3" text-anchor="end">30 LD</text>
              
            
              
                <text x="36" y="20" dy="3" text-anchor="end">40 LD</text>
              
            
          </g>
        

        <!-- NOW Vertical Centerline -->
        <g stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3">
          <line x1="192.5" y1="18" x2="192.5" y2="155" />
        </g>
        <g fill="currentColor" class="label label--small">
          <text x="192.5" y="12" text-anchor="middle">NOW (T-0)</text>
        </g>

        <!-- Time Ticks along Bottom X-axis -->
        
          <g stroke="currentColor" stroke-width="1.5">
            
              
                <line x1="61.8" y1="155" x2="61.8" y2="159" />
              
            
              
                <line x1="105.4" y1="155" x2="105.4" y2="159" />
              
            
              
                <line x1="148.9" y1="155" x2="148.9" y2="159" />
              
            
              
                <line x1="192.5" y1="155" x2="192.5" y2="159" />
              
            
              
                <line x1="236.1" y1="155" x2="236.1" y2="159" />
              
            
              
                <line x1="279.6" y1="155" x2="279.6" y2="159" />
              
            
              
                <line x1="323.2" y1="155" x2="323.2" y2="159" />
              
            
          </g>
          <g fill="currentColor" class="label label--small">
            
              
                <text x="61.8" y="169" text-anchor="middle">-3d</text>
              
            
              
                <text x="105.4" y="169" text-anchor="middle">-2d</text>
              
            
              
                <text x="148.9" y="169" text-anchor="middle">-1d</text>
              
            
              
            
              
                <text x="236.1" y="169" text-anchor="middle">+1d</text>
              
            
              
                <text x="279.6" y="169" text-anchor="middle">+2d</text>
              
            
              
                <text x="323.2" y="169" text-anchor="middle">+3d</text>
              
            
          </g>
        

        <!-- Asteroid Markers -->
        
          <g stroke="currentColor" stroke-width="1.5" clip-path="url(#chart-clip-half-v)">
            
              
                <circle cx="345" cy="125.7" r="3" fill="none" />
              
            
              
                <circle cx="225.6" cy="123.5" r="9" fill="currentColor" />
              
            
              
                <circle cx="316.1" cy="118.2" r="3" fill="none" />
              
            
              
                <circle cx="240" cy="117.4" r="9" fill="currentColor" />
              
            
              
                <circle cx="345" cy="89.4" r="3" fill="none" />
              
            
          </g>
          <g fill="currentColor" class="label label--small">
            
              
                <text x="339" y="128.7" text-anchor="end">RH16</text>
              
            
              
                <text x="237.6" y="126.5" text-anchor="start">B..</text>
              
            
              
                <text x="322.1" y="121.2" text-anchor="start">EK</text>
              
            
              
                <text x="252" y="120.4" text-anchor="start">BP31</text>
              
            
              
                <text x="339" y="92.4" text-anchor="end">RD2</text>
              
            
          </g>
        
      </svg>
    </div>
    
    <!-- Middle Telemetry Status Row -->
    <div class="flex flex--row flex--center-y gap--small p--1 w--full">
      <div class="flex flex--col">
        <div class="title title--small">ASTEROIDS</div>
        <div class="label label--small">DETECTED: 43 NEOs</div>
      </div>
      
      <div class="flex flex--row flex--center-y gap--small ml--auto">
        
          <span class="label label--warning p--1"><strong>ALERT</strong></span>
        
      </div>
      
      <div class="flex flex--col items--end ml--auto text--right">
        <span class="label">CLOSEST</span>
        <span class="value value--small">8.7 LD</span>
      </div>
    </div>

    <!-- Bottom: Closest Scheduled Flybys -->
    <div class="flex flex--col gap--xsmall w--full p--1">
      <div class="label"><strong>CLOSEST SCHEDULED FLYBYS</strong></div>
      
      
        
          <div class="flex flex--row flex--center-y gap--small p--1 rounded bg--gray-75 grow">
            <div class="grow">
              <div class="title title--small" data-clamp="1">RH16</div>
              <div class="label label--small" data-clamp="1">T+3d 23h &bull; Size: 25m</div>
            </div>
            <div class="text--right flex flex--col layout--right">
              <div class="value value--small" data-clamp="1">8.7 LD</div>
              
            </div>
          </div>
        
          <div class="flex flex--row flex--center-y gap--small p--1 rounded bg--gray-75 grow">
            <div class="grow">
              <div class="title title--small" data-clamp="1">B..</div>
              <div class="label label--small" data-clamp="1">T+18h &bull; Size: 536m</div>
            </div>
            <div class="text--right flex flex--col layout--right">
              <div class="value value--small" data-clamp="1">9.3 LD</div>
              
                <span class="label label--warning px--1"><strong>HAZARD</strong></span>
              
            </div>
          </div>
        
          <div class="flex flex--row flex--center-y gap--small p--1 rounded bg--gray-75 grow">
            <div class="grow">
              <div class="title title--small" data-clamp="1">EK</div>
              <div class="label label--small" data-clamp="1">T+2d 20h &bull; Size: 6m</div>
            </div>
            <div class="text--right flex flex--col layout--right">
              <div class="value value--small" data-clamp="1">10.9 LD</div>
              
            </div>
          </div>
        
      
    </div>
  
</div>
<div class="title_bar">
    
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
