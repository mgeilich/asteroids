<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      <div class="mashup mashup--1Lx1R">
      <div class="view view--half_vertical">
        





































<!-- class="layout" -->
<div class="layout layout--col gap--small">
  
    <!-- Top Half: Linear Timeline Chart (360x180) -->
    <div class="w--full flex flex--col flex--center-x">
      <svg width="360" height="180" viewBox="0 0 360 180" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
        <defs>
          <clipPath id="chart-clip-half-v">
            <rect x="38" y="16" width="310" height="142" />
          </clipPath>
        </defs>

        <!-- Axes -->
        <g stroke="currentColor" stroke-width="1.5">
          <line x1="40" y1="18" x2="40" y2="155" />
          <line x1="40" y1="155" x2="345" y2="155" stroke-width="2" />
        </g>

        <!-- Horizontal Gridlines -->
        
          <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 4">
            
              
                <line x1="40" y1="114" x2="345" y2="114" />
              
            
              
                <line x1="40" y1="78.7" x2="345" y2="78.7" />
              
            
              
                <line x1="40" y1="55.3" x2="345" y2="55.3" />
              
            
              
                <line x1="40" y1="37.7" x2="345" y2="37.7" />
              
            
              
                <line x1="40" y1="20" x2="345" y2="20" />
              
            
          </g>
          <g fill="currentColor" class="label label--small">
            
              
                <text x="36" y="114" dy="3" text-anchor="end">5 LD</text>
              
            
              
                <text x="36" y="78.7" dy="3" text-anchor="end">20 LD</text>
              
            
              
                <text x="36" y="55.3" dy="3" text-anchor="end">50 LD</text>
              
            
              
                <text x="36" y="37.7" dy="3" text-anchor="end">100 LD</text>
              
            
              
                <text x="36" y="20" dy="3" text-anchor="end">200 LD</text>
              
            
            <text x="36" y="155" dy="3" text-anchor="end">Earth</text>
          </g>
        

        <!-- Header Labels -->
        <g fill="currentColor" class="label label--small">
          <text x="40" y="12" text-anchor="start">NOW (T-0)</text>
          <text x="345" y="12" text-anchor="end">T+7 DAYS</text>
        </g>

        <!-- Time Ticks along Bottom X-axis -->
        
          <g stroke="currentColor" stroke-width="1.5">
            
              
                <line x1="40" y1="155" x2="40" y2="159" />
              
            
              
                <line x1="83.6" y1="155" x2="83.6" y2="159" />
              
            
              
                <line x1="127.1" y1="155" x2="127.1" y2="159" />
              
            
              
                <line x1="170.7" y1="155" x2="170.7" y2="159" />
              
            
              
                <line x1="214.3" y1="155" x2="214.3" y2="159" />
              
            
              
                <line x1="257.9" y1="155" x2="257.9" y2="159" />
              
            
              
                <line x1="301.4" y1="155" x2="301.4" y2="159" />
              
            
              
                <line x1="345" y1="155" x2="345" y2="159" />
              
            
          </g>
          <g fill="currentColor" class="label label--small">
            
              
            
              
                <text x="83.6" y="169" text-anchor="middle">+1d</text>
              
            
              
                <text x="127.1" y="169" text-anchor="middle">+2d</text>
              
            
              
                <text x="170.7" y="169" text-anchor="middle">+3d</text>
              
            
              
                <text x="214.3" y="169" text-anchor="middle">+4d</text>
              
            
              
                <text x="257.9" y="169" text-anchor="middle">+5d</text>
              
            
              
                <text x="301.4" y="169" text-anchor="middle">+6d</text>
              
            
              
                <text x="345" y="169" text-anchor="middle">+7d</text>
              
            
          </g>
        

        <!-- Asteroid Markers -->
        
          <g stroke="currentColor" stroke-width="1.5" clip-path="url(#chart-clip-half-v)">
            
              
                <circle cx="41.9" cy="98.1" r="9" fill="currentColor" />
              
            
              
                <circle cx="142.8" cy="37.2" r="7" fill="currentColor" />
              
            
              
                <circle cx="301" cy="30.6" r="9" fill="currentColor" />
              
            
              
                <circle cx="223.7" cy="22" r="9" fill="currentColor" />
              
            
              
                <circle cx="182.2" cy="100" r="3" fill="none" />
              
            
              
                <circle cx="132.3" cy="94.2" r="3" fill="none" />
              
            
              
                <circle cx="202.3" cy="79.4" r="3" fill="none" />
              
            
              
                <circle cx="146.9" cy="60.1" r="3" fill="none" />
              
            
              
                <circle cx="186.7" cy="59.7" r="5" fill="none" />
              
            
              
                <circle cx="295.8" cy="59.2" r="5" fill="none" />
              
            
              
                <circle cx="84.4" cy="59.2" r="3" fill="none" />
              
            
              
                <circle cx="210.7" cy="44.6" r="9" fill="none" />
              
            
          </g>
          <g fill="currentColor" class="label label--small">
            
              
                <text x="53.9" y="101.1" text-anchor="start">2006 B..</text>
              
            
              
                <text x="152.8" y="40.2" text-anchor="start">JR28</text>
              
            
              
                <text x="313" y="33.6" text-anchor="start">1998 QC1</text>
              
            
              
                <text x="235.7" y="25" text-anchor="start">CT4</text>
              
            
              
                <text x="188.2" y="103" text-anchor="start">RH16</text>
              
            
              
                <text x="138.3" y="97.2" text-anchor="start">EK</text>
              
            
              
                <text x="208.3" y="82.4" text-anchor="start">RD2</text>
              
            
              
                <text x="152.9" y="63.1" text-anchor="start">HU4</text>
              
            
              
                <text x="194.7" y="62.7" text-anchor="start">RP40</text>
              
            
              
                <text x="303.8" y="62.2" text-anchor="start">DM215</text>
              
            
              
                <text x="90.4" y="62.2" text-anchor="start">DX1</text>
              
            
              
                <text x="222.7" y="47.6" text-anchor="start">LL6</text>
              
            
          </g>
        
      </svg>
    </div>
    
    <!-- Middle Telemetry Status Row -->
    <div class="flex flex--row flex--center-y gap--small p--1 w--full">
      <div class="flex flex--col">
        <div class="title title--small">ASTEROIDS</div>
        <div class="label label--small">UPCOMING: 40 NEOs</div>
      </div>
      
      <div class="flex flex--row flex--center-y gap--small ml--auto">
        
          <span class="label label--warning p--1"><strong>ALERT</strong></span>
        
      </div>
      
      <div class="flex flex--col items--end ml--auto text--right">
        <span class="label">CLOSEST</span>
        <span class="value value--small">8.7 LD</span>
      </div>
    </div>

    <!-- Bottom: Closest Scheduled Flybys -->
    <div class="flex flex--col gap--xsmall w--full p--1">
      <div class="label"><strong>CLOSEST SCHEDULED FLYBYS</strong></div>
      
      
        
          <div class="flex flex--row flex--center-y gap--small p--1 rounded bg--gray-75 grow">
            <div class="grow">
              <div class="title title--small" data-clamp="1">RH16</div>
              <div class="label label--small" data-clamp="1">T+3d 6h &bull; Size: 25m</div>
            </div>
            <div class="text--right flex flex--col layout--right">
              <div class="value value--small" data-clamp="1">8.7 LD</div>
              
            </div>
          </div>
        
          <div class="flex flex--row flex--center-y gap--small p--1 rounded bg--gray-75 grow">
            <div class="grow">
              <div class="title title--small" data-clamp="1">2006 B..</div>
              <div class="label label--small" data-clamp="1">T+1h &bull; Size: 536m</div>
            </div>
            <div class="text--right flex flex--col layout--right">
              <div class="value value--small" data-clamp="1">9.3 LD</div>
              
                <span class="label label--warning px--1"><strong>HAZARD</strong></span>
              
            </div>
          </div>
        
          <div class="flex flex--row flex--center-y gap--small p--1 rounded bg--gray-75 grow">
            <div class="grow">
              <div class="title title--small" data-clamp="1">EK</div>
              <div class="label label--small" data-clamp="1">T+2d 2h &bull; Size: 5m</div>
            </div>
            <div class="text--right flex flex--col layout--right">
              <div class="value value--small" data-clamp="1">10.9 LD</div>
              
            </div>
          </div>
        
      
    </div>
  
</div>
<div class="title_bar">
    
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      </div>
    </div>
  </body>
</html>
