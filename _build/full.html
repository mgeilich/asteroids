<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />

    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->

  <body class="environment trmnl">
    <div class="screen">
      
      <div class="view view--full">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->

            <line x1="46" y1="230" x2="350" y2="230" stroke-width="2" />
          </g>

            <g fill="#000">

          <!-- Header Labels -->
          <g fill="#000" font-weight="bold">
            <text x="46" y="14" text-anchor="start">NOW (T-0)</text>
            <text x="350" y="14" text-anchor="end">T+7 DAYS</text>

          <!-- Time Ticks along Bottom X-axis -->

                  <line x1="350" y1="230" x2="350" y2="234" />

            <g fill="#000">
              
                
              
                
                  <text x="89.4" y="244" text-anchor="middle">+1d</text>
                
              
                
                  <text x="132.9" y="244" text-anchor="middle">+2d</text>
                
              
                
                  <text x="176.3" y="244" text-anchor="middle">+3d</text>

                  <text x="350" y="244" text-anchor="middle">+7d</text>

          <!-- Asteroid Markers and Labels -->

                  <text x="154" y="36.5" text-anchor="start" data-clamp="1">YF4</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Telemetry Header, Stats & Closest Flybys -->
      <div class="w--full flex flex--col grow">
        <div class="flex flex--col gap--space-between w--full grow">
          
          <!-- Header / Status Row -->
          <div class="flex flex--row flex--center-y gap--small lg:gap--medium w--full">
            <div>
              <div class="title title--base lg:title--large">PLANETARY DEFENSE</div>
              <div class="label lg:label--large">NEO TIMELINE MONITOR</div>
            </div>
            
            <div class="flex flex--row flex--center-y gap--small ml--auto">
              
                <div class="label label--outline p--1 lg:p--1.5 lg:label--large flex flex--row flex--center-x">
                  SYSTEM STATUS: NOMINAL // ALL ENCOUNTERS SAFE
                </div>
              
            </div>
          </div>
          
          <!-- Key Statistics Grid -->
          <div class="grid grid--cols-2 portrait:grid--cols-1 gap--small lg:gap--medium w--full">
            <div class="bg--gray-75 rounded p--1 lg:p--2 flex flex--col flex--center-x">
              <span class="label lg:label--large 1bit:text-stroke 2bit:text-stroke">UPCOMING (7D)</span>
              <span class="value value--base portrait:value--small lg:value--xlarge 1bit:text-stroke 2bit:text-stroke">41</span>
            </div>
            <div class="bg--gray-75 rounded p--1 lg:p--2 flex flex--col flex--center-x">
              <span class="label lg:label--large 1bit:text-stroke 2bit:text-stroke">CLOSEST APPROACH</span>
              <span class="value value--base portrait:value--small lg:value--xlarge 1bit:text-stroke 2bit:text-stroke">9.3 LD</span>
            </div>
          </div>
          
          <!-- Closest Scheduled Flybys -->
          <div class="flex flex--col gap--xsmall lg:gap--small w--full">
            <div class="label lg:label--large">CLOSEST SCHEDULED FLYBYS</div>
            
            
              <div class="grid grid--cols-1 gap--xsmall lg:gap--small w--full">
                
                  
                    <div class="rounded bg--gray-75 p--1 lg:p--1.5 ">
                      <div class="flex flex--row flex--center-y gap--space-between w--full">
                        <div class="grow">
                          <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">FX9</div>
                          <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+3d 11h &bull; Size: 66m</div>
                        </div>
                        <div class="text--right flex flex--col ml--auto">
                          <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">9.3 LD</div>
                          
                        </div>
                      </div>
                    </div>
                  
                
                  
                    <div class="rounded bg--gray-75 p--1 lg:p--1.5 ">

                        </div>
                        <div class="text--right flex flex--col ml--auto">
                          <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">20.2 LD</div>
                          
                            <span class="label label--filled px--1 lg:px--2 lg:label--base">HAZARD</span>
                          
                        </div>
                      </div>
                    </div>
                  
                
                  
                    <div class="rounded bg--gray-75 p--1 lg:p--1.5 hidden lg:block">
                      <div class="flex flex--row flex--center-y gap--space-between w--full">
                        <div class="grow">
                          <div class="title title--small lg:title--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">VG</div>
                          <div class="label label--small lg:label--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">T+4d 6h &bull; Size: 14m</div>
                        </div>
                        <div class="text--right flex flex--col ml--auto">
                          <div class="value value--small lg:value--base 1bit:text-stroke 2bit:text-stroke" data-clamp="1">21.0 LD</div>
                          
                        </div>
                      </div>
                    </div>
                  
                
              </div>

</div>
