<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      
      <div class="view view--full">
        





































<!-- class="layout" -->
<div class="layout layout--col gap--small">
  
    <div class="grid grid--cols-2 gap--small w--full grow p--1">
      
      <!-- Left Column: Linear Coordinate Timeline Chart -->
      <div class="col--span-1 w--full flex flex--col flex--center-x">
        <svg width="360" height="260" viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full h--auto">
          <defs>
            <clipPath id="chart-clip-full">
              <rect x="38" y="18" width="310" height="214" />
            </clipPath>
          </defs>

          <!-- Axes & Borders -->
          <g stroke="currentColor" stroke-width="1.5">
            <!-- Y-axis (Distance / NOW) & X-axis (Earth / Future Days) -->
            <line x1="40" y1="20" x2="40" y2="230" />
            <line x1="40" y1="230" x2="345" y2="230" stroke-width="2" />
          </g>

          <!-- Horizontal Distance Gridlines -->
          
            <g stroke="currentColor" stroke-width="1" stroke-dasharray="2 4">
              
                
                  <line x1="40" y1="203.2" x2="345" y2="203.2" />
                
              
                
                  <line x1="40" y1="167.7" x2="345" y2="167.7" />
                
              
                
                  <line x1="40" y1="140.9" x2="345" y2="140.9" />
                
              
                
                  <line x1="40" y1="105.5" x2="345" y2="105.5" />
                
              
                
                  <line x1="40" y1="78.6" x2="345" y2="78.6" />
                
              
                
                  <line x1="40" y1="51.8" x2="345" y2="51.8" />
                
              
                
                  <line x1="40" y1="25" x2="345" y2="25" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
                  <text x="36" y="203.2" dy="3" text-anchor="end">2 LD</text>
                
              
                
                  <text x="36" y="167.7" dy="3" text-anchor="end">5 LD</text>
                
              
                
                  <text x="36" y="140.9" dy="3" text-anchor="end">10 LD</text>
                
              
                
                  <text x="36" y="105.5" dy="3" text-anchor="end">25 LD</text>
                
              
                
                  <text x="36" y="78.6" dy="3" text-anchor="end">50 LD</text>
                
              
                
                  <text x="36" y="51.8" dy="3" text-anchor="end">100 LD</text>
                
              
                
                  <text x="36" y="25" dy="3" text-anchor="end">200 LD</text>
                
              
              <text x="36" y="230" dy="3" text-anchor="end">Earth</text>
            </g>
          

          <!-- Header Labels -->
          <g fill="currentColor" class="label label--small">
            <text x="40" y="14" text-anchor="start">NOW (T-0)</text>
            <text x="345" y="14" text-anchor="end">T+7 DAYS</text>
          </g>

          <!-- Time Ticks along Bottom X-axis -->
          
            <g stroke="currentColor" stroke-width="1.5">
              
                
                  <line x1="40" y1="230" x2="40" y2="234" />
                
              
                
                  <line x1="83.6" y1="230" x2="83.6" y2="234" />
                
              
                
                  <line x1="127.1" y1="230" x2="127.1" y2="234" />
                
              
                
                  <line x1="170.7" y1="230" x2="170.7" y2="234" />
                
              
                
                  <line x1="214.3" y1="230" x2="214.3" y2="234" />
                
              
                
                  <line x1="257.9" y1="230" x2="257.9" y2="234" />
                
              
                
                  <line x1="301.4" y1="230" x2="301.4" y2="234" />
                
              
                
                  <line x1="345" y1="230" x2="345" y2="234" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
              
                
                  <text x="83.6" y="244" text-anchor="middle">+1d</text>
                
              
                
                  <text x="127.1" y="244" text-anchor="middle">+2d</text>
                
              
                
                  <text x="170.7" y="244" text-anchor="middle">+3d</text>
                
              
                
                  <text x="214.3" y="244" text-anchor="middle">+4d</text>
                
              
                
                  <text x="257.9" y="244" text-anchor="middle">+5d</text>
                
              
                
                  <text x="301.4" y="244" text-anchor="middle">+6d</text>
                
              
                
                  <text x="345" y="244" text-anchor="middle">+7d</text>
                
              
            </g>
          

          <!-- Asteroid Markers and Labels -->
          
            <g stroke="currentColor" stroke-width="1.5" clip-path="url(#chart-clip-full)">
              
                
                  <circle cx="41.9" cy="143.6" r="9" fill="currentColor" />
                
              
                
                  <circle cx="142.8" cy="51.1" r="7" fill="currentColor" />
                
              
                
                  <circle cx="301" cy="41.2" r="9" fill="currentColor" />
                
              
                
                  <circle cx="223.7" cy="28" r="9" fill="currentColor" />
                
              
                
                  <circle cx="182.2" cy="146.4" r="3" fill="none" />
                
              
                
                  <circle cx="132.3" cy="137.6" r="3" fill="none" />
                
              
                
                  <circle cx="202.3" cy="115.2" r="3" fill="none" />
                
              
                
                  <circle cx="146.9" cy="85.8" r="3" fill="none" />
                
              
                
                  <circle cx="186.7" cy="85.3" r="5" fill="none" />
                
              
                
                  <circle cx="295.8" cy="84.6" r="5" fill="none" />
                
              
                
                  <circle cx="84.4" cy="84.5" r="3" fill="none" />
                
              
                
                  <circle cx="309.3" cy="64.9" r="3" fill="none" />
                
              
                
                  <circle cx="210.7" cy="62.4" r="9" fill="none" />
                
              
                
                  <circle cx="172.1" cy="54.9" r="5" fill="none" />
                
              
                
                  <circle cx="56.6" cy="29.7" r="7" fill="none" />
                
              
                
                  <circle cx="252" cy="27" r="3" fill="none" />
                
              
            </g>
            <g fill="currentColor" class="label label--small">
              
                
                  <text x="53.9" y="146.6" text-anchor="start">2006 B..</text>
                
              
                
                  <text x="152.8" y="54.1" text-anchor="start">JR28</text>
                
              
                
                  <text x="313" y="44.2" text-anchor="start">1998 QC1</text>
                
              
                
                  <text x="235.7" y="31" text-anchor="start">CT4</text>
                
              
                
                  <text x="188.2" y="149.4" text-anchor="start">RH16</text>
                
              
                
                  <text x="138.3" y="140.6" text-anchor="start">EK</text>
                
              
                
                  <text x="208.3" y="118.2" text-anchor="start">RD2</text>
                
              
                
                  <text x="152.9" y="88.8" text-anchor="start">HU4</text>
                
              
                
                  <text x="194.7" y="88.3" text-anchor="start">RP40</text>
                
              
                
                  <text x="303.8" y="87.6" text-anchor="start">DM215</text>
                
              
                
                  <text x="90.4" y="87.5" text-anchor="start">DX1</text>
                
              
                
                  <text x="315.3" y="67.9" text-anchor="start">QB35</text>
                
              
                
                  <text x="222.7" y="65.4" text-anchor="start">LL6</text>
                
              
                
                  <text x="180.1" y="57.9" text-anchor="start">FR</text>
                
              
                
                  <text x="66.6" y="32.7" text-anchor="start">DR37</text>
                
              
                
                  <text x="258" y="30" text-anchor="start">HE</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Telemetry Header, Stats & Closest Flybys -->
      <div class="col--span-1 w--full flex flex--col">
        <div class="flex flex--col gap--small w--full grow p--1">
          
          <!-- Header / Status Row -->
          <div class="flex flex--row flex--center-y gap--small w--full">
            <div>
              <div class="title title--base">PLANETARY DEFENSE</div>
              <div class="label">NEO TIMELINE MONITOR</div>
            </div>
            
            <div class="flex flex--row flex--center-y gap--small ml--auto">
              
                <div class="label label--warning p--1 flex flex--row flex--center-x">
                  <strong>WARNING: POTENTIALLY HAZARDOUS OBJECT IN SECTOR</strong>
                </div>
              
            </div>
          </div>
          
          <!-- Key Statistics Grid -->
          <div class="grid grid--cols-2 gap--small w--full">
            <div class="bg--gray-75 rounded p--1 flex flex--col flex--center-x">
              <span class="label">UPCOMING (7D)</span>
              <span class="value value--base">40</span>
            </div>
            <div class="bg--gray-75 rounded p--1 flex flex--col flex--center-x">
              <span class="label">CLOSEST APPROACH</span>
              <span class="value value--base">8.7 LD</span>
            </div>
          </div>
          
          <!-- Closest Scheduled Flybys -->
          <div class="flex flex--col gap--xsmall w--full">
            <div class="label"><strong>CLOSEST SCHEDULED FLYBYS</strong></div>
            
            
              <div class="grid grid--cols-1 gap--small w--full">
                
                  <div class="rounded bg--gray-75 p--1">
                    <div class="flex flex--row flex--center-y gap--small w--full">
                      <div class="grow">
                        <div class="title title--small" data-clamp="1">RH16</div>
                        <div class="label label--small" data-clamp="1">T+3d 6h &bull; Size: 25m</div>
                      </div>
                      <div class="text--right flex flex--col layout--right">
                        <div class="value value--small" data-clamp="1">8.7 LD</div>
                        
                      </div>
                    </div>
                  </div>
                
                  <div class="rounded bg--gray-75 p--1">
                    <div class="flex flex--row flex--center-y gap--small w--full">
                      <div class="grow">
                        <div class="title title--small" data-clamp="1">2006 B..</div>
                        <div class="label label--small" data-clamp="1">T+1h &bull; Size: 536m</div>
                      </div>
                      <div class="text--right flex flex--col layout--right">
                        <div class="value value--small" data-clamp="1">9.3 LD</div>
                        
                          <span class="label label--warning px--1"><strong>HAZARD</strong></span>
                        
                      </div>
                    </div>
                  </div>
                
                  <div class="rounded bg--gray-75 p--1">
                    <div class="flex flex--row flex--center-y gap--small w--full">
                      <div class="grow">
                        <div class="title title--small" data-clamp="1">EK</div>
                        <div class="label label--small" data-clamp="1">T+2d 2h &bull; Size: 5m</div>
                      </div>
                      <div class="text--right flex flex--col layout--right">
                        <div class="value value--small" data-clamp="1">10.9 LD</div>
                        
                      </div>
                    </div>
                  </div>
                
              </div>
            
          </div>
        </div>
      </div>
    </div>
  
</div>
<div class="title_bar">
    
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      
    </div>
  </body>
</html>
