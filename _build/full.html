<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="https://trmnl.com/css/3.1.1/plugins.css" />
    <script src="https://trmnl.com/js/3.1.1/plugins.js"></script>
    <meta name="trmnl-framework-version" content="3.1.1" />
    <meta name="trmnl-framework-pinned" content="false" />

    <!-- Begin Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <!-- End Inter font -->
  </head>

  <body class="environment trmnl">
    <div class="screen">
      
      <div class="view view--full">
        <!-- closest_list contains top 3; views show top 2 to preserve vertical breathing room -->





<!-- class="layout" -->
<div class="layout layout--col layout--stretch p--1">
  
    <div class="grid grid--cols-2 portrait:grid--cols-1 gap--small w--full grow">
      
      <!-- Left Column: Linear Coordinate Timeline Chart -->
      <div class="w--full flex flex--col flex--center-x flex--center-y grow">
        <svg width="360" height="260" viewBox="0 0 360 260" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg" class="w--full max-w--full h--auto portrait:w--full">
          <defs>
            <clipPath id="chart-clip-full">
              <rect x="38" y="18" width="310" height="214" />
            </clipPath>
          </defs>

          <!-- Axes -->
          <g stroke="#000" stroke-width="1.5">
            <!-- Y-axis (Distance / NOW) & X-axis (Earth / Future Days) -->
            <line x1="46" y1="20" x2="46" y2="230" />
            <line x1="46" y1="230" x2="350" y2="230" stroke-width="2" />
          </g>

          <!-- Horizontal Distance Gridlines -->
          
            <g stroke="#000" stroke-width="1" stroke-dasharray="2 2">
              
                
                  <line x1="46" y1="203.2" x2="350" y2="203.2" />
                
              
                
                  <line x1="46" y1="167.7" x2="350" y2="167.7" />
                
              
                
                  <line x1="46" y1="140.9" x2="350" y2="140.9" />
                
              
                
                  <line x1="46" y1="105.5" x2="350" y2="105.5" />
                
              
                
                  <line x1="46" y1="78.6" x2="350" y2="78.6" />
                
              
                
                  <line x1="46" y1="51.8" x2="350" y2="51.8" />
                
              
                
                  <line x1="46" y1="25" x2="350" y2="25" />
                
              
            </g>
            <g fill="#000">
              
                
                  <text x="42" y="203.2" dy="3" text-anchor="end">2 LD</text>
                
              
                
                  <text x="42" y="167.7" dy="3" text-anchor="end">5 LD</text>
                
              
                
                  <text x="42" y="140.9" dy="3" text-anchor="end">10 LD</text>
                
              
                
                  <text x="42" y="105.5" dy="3" text-anchor="end">25 LD</text>
                
              
                
                  <text x="42" y="78.6" dy="3" text-anchor="end">50 LD</text>
                
              
                
                  <text x="42" y="51.8" dy="3" text-anchor="end">100 LD</text>
                
              
                
                  <text x="42" y="25" dy="3" text-anchor="end">200 LD</text>
                
              
              <text x="42" y="230" dy="3" text-anchor="end">Earth</text>
            </g>
          

          <!-- Header Labels -->
          <g fill="#000" font-weight="bold">
            <text x="46" y="14" text-anchor="start">NOW (T-0)</text>
            <text x="350" y="14" text-anchor="end">T+7 DAYS</text>
          </g>

          <!-- Time Ticks along Bottom X-axis -->
          
            <g stroke="#000" stroke-width="1.5">
              
                
                  <line x1="46" y1="230" x2="46" y2="234" />
                
              
                
                  <line x1="89.4" y1="230" x2="89.4" y2="234" />
                
              
                
                  <line x1="132.9" y1="230" x2="132.9" y2="234" />
                
              
                
                  <line x1="176.3" y1="230" x2="176.3" y2="234" />
                
              
                
                  <line x1="219.7" y1="230" x2="219.7" y2="234" />
                
              
                
                  <line x1="263.1" y1="230" x2="263.1" y2="234" />
                
              
                
                  <line x1="306.6" y1="230" x2="306.6" y2="234" />
                
              
                
                  <line x1="350" y1="230" x2="350" y2="234" />
                
              
            </g>
            <g fill="#000">
              
                
              
                
                  <text x="89.4" y="244" text-anchor="middle">+1d</text>
                
              
                
                  <text x="132.9" y="244" text-anchor="middle">+2d</text>
                
              
                
                  <text x="176.3" y="244" text-anchor="middle">+3d</text>
                
              
                
                  <text x="219.7" y="244" text-anchor="middle">+4d</text>
                
              
                
                  <text x="263.1" y="244" text-anchor="middle">+5d</text>
                
              
                
                  <text x="306.6" y="244" text-anchor="middle">+6d</text>
                
              
                
                  <text x="350" y="244" text-anchor="middle">+7d</text>
                
              
            </g>
          

          <!-- Asteroid Markers and Labels -->
          
            <g stroke="#000" stroke-width="1.5" clip-path="url(#chart-clip-full)">
              
                
                  <circle cx="89.9" cy="41.2" r="9" fill="#000" />
                
              
                
                  <circle cx="163.4" cy="39.5" r="7" fill="#000" />
                
              
                
                  <circle cx="256.4" cy="29.1" r="9" fill="#000" />
                
              
                
                  <circle cx="337.2" cy="85.8" r="5" fill="none" />
                
              
                
                  <circle cx="84.7" cy="84.6" r="5" fill="none" />
                
              
                
                  <circle cx="284.4" cy="84.4" r="5" fill="none" />
                
              
                
                  <circle cx="221.4" cy="79" r="9" fill="none" />
                
              
                
                  <circle cx="98.2" cy="64.9" r="3" fill="none" />
                
              
                
                  <circle cx="196.3" cy="60.4" r="3" fill="none" />
                
              
                
                  <circle cx="134.8" cy="55.8" r="5" fill="none" />
                
              
                
                  <circle cx="274.4" cy="54.7" r="5" fill="none" />
                
              
                
                  <circle cx="311.2" cy="43.4" r="7" fill="none" />
                
              
                
                  <circle cx="221.9" cy="38.9" r="5" fill="none" />
                
              
                
                  <circle cx="195.7" cy="38" r="5" fill="none" />
                
              
                
                  <circle cx="346.9" cy="27.1" r="7" fill="none" />
                
              
            </g>
            <g fill="#000" clip-path="url(#chart-clip-full)">
              
                
                  <text x="101.9" y="44.2" text-anchor="start" data-clamp="1">1998 ..</text>
                
              
                
                  <text x="173.4" y="42.5" text-anchor="start" data-clamp="1">HC2</text>
                
              
                
                  <text x="268.4" y="32.1" text-anchor="start" data-clamp="1">BT2</text>
                
              
                
                  <text x="329.2" y="88.8" text-anchor="end" data-clamp="1">TG135</text>
                
              
                
                  <text x="92.7" y="87.6" text-anchor="start" data-clamp="1">DM215</text>
                
              
                
                  <text x="292.4" y="87.4" text-anchor="start" data-clamp="1">OY3</text>
                
              
                
                  <text x="233.4" y="82" text-anchor="start" data-clamp="1">2007 ..</text>
                
              
                
                  <text x="104.2" y="67.9" text-anchor="start" data-clamp="1">QB35</text>
                
              
                
                  <text x="202.3" y="63.4" text-anchor="start" data-clamp="1">CE22</text>
                
              
                
                  <text x="142.8" y="58.8" text-anchor="start" data-clamp="1">PM</text>
                
              
                
                  <text x="282.4" y="57.7" text-anchor="start" data-clamp="1">LV</text>
                
              
                
                  <text x="321.2" y="46.4" text-anchor="start" data-clamp="1">TP</text>
                
              
                
                  <text x="229.9" y="41.9" text-anchor="start" data-clamp="1">TH1</text>
                
              
                
                  <text x="203.7" y="41" text-anchor="start" data-clamp="1">EY</text>
                
              
                
                  <text x="336.9" y="30.1" text-anchor="end" data-clamp="1">BW510</text>
                
              
            </g>
          
        </svg>
      </div>

      <!-- Right Column: Telemetry Header, Stats & Closest Flybys -->
      <div class="w--full flex flex--col grow">
        <div class="flex flex--col gap--space-between w--full grow">
          
          <!-- Header / Status Row -->
          <div class="flex flex--row flex--center-y gap--small w--full">
            <div>
              <div class="title title--base">PLANETARY DEFENSE</div>
              <div class="label">NEO TIMELINE MONITOR</div>
            </div>
            
            <div class="flex flex--row flex--center-y gap--small ml--auto">
              
                <div class="label label--outline p--1 flex flex--row flex--center-x">
                  SYSTEM STATUS: NOMINAL // ALL ENCOUNTERS SAFE
                </div>
              
            </div>
          </div>
          
          <!-- Key Statistics Grid -->
          <div class="grid grid--cols-2 portrait:grid--cols-1 gap--small w--full">
            <div class="bg--gray-75 rounded p--1 flex flex--col flex--center-x">
              <span class="label">UPCOMING (7D)</span>
              <span class="value value--base portrait:value--small">30</span>
            </div>
            <div class="bg--gray-75 rounded p--1 flex flex--col flex--center-x">
              <span class="label">CLOSEST APPROACH</span>
              <span class="value value--base portrait:value--small">41.6 LD</span>
            </div>
          </div>
          
          <!-- Closest Scheduled Flybys -->
          <div class="flex flex--col gap--xsmall w--full">
            <div class="label">CLOSEST SCHEDULED FLYBYS</div>
            
            
              <div class="grid grid--cols-1 gap--xsmall w--full">
                
                  
                    <div class="rounded bg--gray-75 p--1">
                      <div class="flex flex--row flex--center-y gap--space-between w--full">
                        <div class="grow">
                          <div class="title title--small" data-clamp="1">TG135</div>
                          <div class="label label--small" data-clamp="1">T+6d 16h &bull; Size: 39m</div>
                        </div>
                        <div class="text--right flex flex--col ml--auto">
                          <div class="value value--small" data-clamp="1">41.6 LD</div>
                          
                        </div>
                      </div>
                    </div>
                  
                
                  
                    <div class="rounded bg--gray-75 p--1">
                      <div class="flex flex--row flex--center-y gap--space-between w--full">
                        <div class="grow">
                          <div class="title title--small" data-clamp="1">DM215</div>
                          <div class="label label--small" data-clamp="1">T+21h &bull; Size: 62m</div>
                        </div>
                        <div class="text--right flex flex--col ml--auto">
                          <div class="value value--small" data-clamp="1">42.9 LD</div>
                          
                        </div>
                      </div>
                    </div>
                  
                
              </div>
            
          </div>
        </div>
      </div>
    </div>
  
</div>
<div class="title_bar">
    <svg class="image image-stroke image-stroke--medium" width="24" height="24" viewBox="0 0 24 24" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">

    </svg>
    <span class="title">Asteroids</span>
    
  </div>

      </div>
      
    </div>
  </body>
</html>
